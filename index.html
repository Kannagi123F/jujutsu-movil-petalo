<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jujutsu Kaisen - Mobile Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;900&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-glow: radial-gradient(circle at center, #0f172a 0%, #020617 70%, #000000 100%);
            --card-glow: rgba(56, 189, 248, 0.25);
            --card-border: rgba(56, 189, 248, 0.3);
            --theme-accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.8);
            --sub-color: #93c5fd;
            --panel-bg: rgba(2, 6, 23, 0.85);
            --badge-bg: linear-gradient(90deg, #38bdf8, #818cf8);
        }

        body.theme-geto {
            --bg-glow: radial-gradient(circle at center, #2b0404 0%, #110101 70%, #000000 100%);
            --card-glow: rgba(239, 68, 68, 0.3);
            --card-border: rgba(239, 68, 68, 0.4);
            --theme-accent: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.9);
            --sub-color: #fca5a5;
            --panel-bg: rgba(15, 1, 1, 0.88);
            --badge-bg: linear-gradient(90deg, #dc2626, #7f1d1d);
        }

        body {
            background: #030712;
            background-image: var(--bg-glow);
            font-family: 'Noto Sans JP', 'Yu Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            transition: background 1.2s ease;
        }

        /* Contenedor principal tipo Pantalla de Smartphone Vertical */
        .mobile-container {
            width: 100%;
            height: 100%;
            max-width: 450px;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
            position: relative;
            background-color: #030712;
            background-image: radial-gradient(circle at 50% 40%, rgba(30, 58, 138, 0.25) 0%, rgba(2, 6, 23, 0.98) 80%);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 40px var(--card-glow);
            overflow: hidden;
            transition: all 1s ease;
        }

        /* Overlay cinemático vertical */
        .scene-cinematic-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 120;
            pointer-events: none;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(2, 6, 23, 0);
            backdrop-filter: blur(0px) grayscale(0%);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .scene-cinematic-overlay.phase-shatter {
            opacity: 1;
            background: radial-gradient(circle, rgba(15, 1, 1, 0.9) 0%, rgba(0, 0, 0, 0.99) 100%);
            backdrop-filter: blur(8px) grayscale(90%);
        }

        .cinematic-text-wrap {
            text-align: center;
            max-width: 85%;
            z-index: 130;
            opacity: 0;
            transform: scale(0.95);
            transition: all 1s ease 0.3s;
        }

        .scene-cinematic-overlay.phase-shatter .cinematic-text-wrap {
            opacity: 1;
            transform: scale(1);
        }

        .cinematic-quote-en {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #f1f5f9;
            font-style: italic;
            margin-bottom: 8px;
        }

        .cinematic-quote-jp {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #94a3b8;
        }

        .cinematic-subtext {
            display: block;
            margin-top: 15px;
            font-family: monospace;
            font-size: 0.55rem;
            letter-spacing: 3px;
            color: #ef4444;
        }

        /* Canvas de partículas de fondo */
        #petals-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Cabecera Móvil */
        .mobile-header {
            position: relative;
            z-index: 25;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hero-quote-header {
            font-size: 0.62rem;
            font-weight: 900;
            color: var(--sub-color);
            letter-spacing: 1px;
            border-left: 2px solid var(--theme-accent);
            padding-left: 8px;
            transition: all 0.8s ease;
        }

        .quote-jp {
            font-size: 0.55rem;
            color: #94a3b8;
            display: block;
            margin-top: 2px;
        }

        /* Área Central (Personaje + Pez Koi + Orbe) */
        .mobile-center-stage {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .character-root {
            position: absolute;
            width: 120%;
            height: 120%;
            bottom: -5%;
            z-index: 10;
            pointer-events: none;
            transition: transform 0.4s ease;
        }

        .character-root.shatter-effect {
            filter: grayscale(100%) brightness(0.65) blur(1px);
        }

        .character-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center bottom;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 30px var(--card-glow));
            animation: float-character 6s ease-in-out infinite;
        }

        /* Orbe Energético */
        .purple-orb {
            position: absolute;
            top: 65%;
            left: 55%;
            width: 0px;
            height: 0px;
            pointer-events: none;
            z-index: 25;
            mix-blend-mode: screen;
            box-shadow: 
                0 0 20px 10px rgba(255, 255, 255, 0.9),
                0 0 50px 25px rgba(216, 180, 254, 0.75),
                0 0 90px 45px rgba(168, 85, 247, 0.4);
            animation: soft-pulse 2.2s ease-in-out infinite alternate;
        }

        body.theme-geto .purple-orb {
            top: 63%;
            left: 52%;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 15%, #fef08a 40%, #eab308 70%, transparent 100%);
            box-shadow: 0 0 25px #fde047, 0 0 60px #eab308;
            animation: pulse-yellow 2s ease-in-out infinite alternate;
        }

        /* =========================================================
           ESTILOS KOI VECTORIAL (DIAGONAL Y FORMA COMPLETA)
        ========================================================= */
        .koi-wrapper {
            position: absolute;
            top: -20%;
            left: -20%;
            transform: scale(0.8) rotate(35deg);
            z-index: 122;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .koi-wrapper.active {
            opacity: 1;
            animation: swim-diagonal 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .koi-container {
            width: 16rem;
            height: 16rem;
        }

        .koi-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .koi-fin.fin-left {
            transform-origin: 85px 120px;
            animation: fin-wiggle 1.1s ease-in-out infinite alternate;
        }
        .koi-fin.fin-right {
            transform-origin: 125px 65px;
            animation: fin-wiggle 1.1s ease-in-out infinite alternate-reverse;
        }

        .koi-tail-rig {
            transform-origin: 152px 152px;
            animation: tail-beat 0.85s ease-in-out infinite alternate;
        }

        /* --- MODO SUGURU: BLANCO LUMINOSO --- */
        .koi-wrapper.mode-suguru .koi-body-curve,
        .koi-wrapper.mode-suguru .koi-head,
        .koi-wrapper.mode-suguru .koi-tail,
        .koi-wrapper.mode-suguru .koi-fin {
            fill: #ffffff;
        }
        .koi-wrapper.mode-suguru .koi-dorsal {
            fill: rgba(255, 255, 255, 0.45);
        }
        .koi-wrapper.mode-suguru .koi-eye {
            fill: #1e293b;
        }
        .koi-wrapper.mode-suguru {
            filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 40px rgba(56, 189, 248, 0.4));
        }

        /* --- MODO SATORU: NEGRO AZABACHE --- */
        .koi-wrapper.mode-satoru .koi-body-curve,
        .koi-wrapper.mode-satoru .koi-head,
        .koi-wrapper.mode-satoru .koi-tail,
        .koi-wrapper.mode-satoru .koi-fin {
            fill: #09090b;
        }
        .koi-wrapper.mode-satoru .koi-dorsal {
            fill: rgba(255, 255, 255, 0.1);
        }
        .koi-wrapper.mode-satoru .koi-eye {
            fill: #ef4444;
        }
        .koi-wrapper.mode-satoru {
            filter: drop-shadow(0 0 18px rgba(239, 68, 68, 0.85)) drop-shadow(0 0 40px rgba(0, 0, 0, 0.95));
        }

        /* Animación de desplazamiento diagonal */
        @keyframes swim-diagonal {
            0% {
                top: -20%;
                left: -20%;
                transform: scale(0.7) rotate(35deg);
            }
            100% {
                top: 110%;
                left: 110%;
                transform: scale(0.9) rotate(25deg);
            }
        }

        @keyframes tail-beat {
            0% { transform: rotate(-14deg); }
            100% { transform: rotate(18deg); }
        }

        @keyframes fin-wiggle {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(12deg); }
        }
        /* Panel Inferior (Títulos + Reproductor compacto) */
        .mobile-footer {
            position: relative;
            z-index: 25;
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            padding: 14px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .main-kanji {
            font-size: 3rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .japanese-sub {
            font-size: 0.65rem;
            color: var(--theme-accent);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .numeric-badge {
            background: var(--badge-bg);
            color: #ffffff;
            padding: 2px 8px;
            font-size: 0.55rem;
            font-weight: 900;
            letter-spacing: 1px;
            border-radius: 2px;
        }

        /* Reproductor móvil */
        .music-player {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-title {
            font-size: 0.6rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 70%;
        }

        .time-display {
            font-size: 0.55rem;
            font-family: monospace;
            color: #94a3b8;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            position: relative;
            border-radius: 2px;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--theme-accent);
            position: absolute;
            top: 0; left: 0;
            border-radius: 2px;
        }

        .player-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .play-btn {
            background: var(--theme-accent);
            border: none;
            color: #030712;
            padding: 5px 16px;
            font-size: 0.6rem;
            font-weight: 900;
            cursor: pointer;
            border-radius: 12px;
        }

        /* Animaciones */
        @keyframes float-character { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
        @keyframes soft-pulse { 0% { opacity: 0.8; } 100% { opacity: 1; } }
        @keyframes pulse-yellow { 0% { transform: scale(0.9); } 100% { transform: scale(1.15); } }
    </style>
</head>
<body>

    <div class="mobile-container" id="main-canvas">
        
        <!-- OVERLAY CINEMÁTICO -->
       <!-- OVERLAY CINEMÁTICO CON PEZ NADANDO EN DIAGONAL -->
        <div class="scene-cinematic-overlay" id="cinematic-layer">
            <div class="koi-wrapper" id="koi-fish">
                <div class="koi-container">
                    <div class="fish">
                        <div class="fish__body">
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                        </div>
                        <div class="snout"></div>
                        <div class="upperfin"></div>
                        <div class="fin left"></div>
                        <div class="fin right"></div>
                        <div class="tail">
                            <div class="tail-left"></div>
                            <div class="tail-right"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="cinematic-text-wrap">
                <p class="cinematic-quote-en" id="cine-en">"Suguru..."</p>
                <p class="cinematic-quote-jp" id="cine-jp">「傑…」</p>
                <span class="cinematic-subtext" id="cine-sub">SEALING PROTOCOL // OVERFLOWING</span>
            </div>
        </div>

        <canvas id="petals-canvas"></canvas>

        <!-- CABECERA -->
        <header class="mobile-header">
            <div class="hero-quote-header" id="quote-container">
                <span id="quote-main">Throughout Heaven and Earth, I alone am the honored one.</span>
                <span class="quote-jp" id="quote-sub">天上天下唯我独尊 // 無量空処</span>
            </div>
        </header>

        <!-- CENTRO (PERSONAJE Y ORBE) -->
        <main class="mobile-center-stage">
            <div class="character-root" id="character-layer">
                <img src="gojo.png" alt="Satoru Gojo" class="character-img" id="gojo-render">
                <div class="purple-orb" id="char-orb"></div>
            </div>
        </main>

        <!-- PIE / PANEL INFERIOR -->
        <footer class="mobile-footer">
            <div class="title-row">
                <div>
                    <span class="japanese-sub" id="label-sub">六眼・無下限呪術</span>
                    <h1 class="main-kanji" id="label-kanji">五条</h1>
                </div>
                <div class="numeric-badge" id="badge-rank">SPECIAL GRADE</div>
            </div>

            <div class="music-player" id="player-card">
                <audio id="audio-element" src="gojo-ost.mp3" preload="auto"></audio>                    
                <audio id="voice-suguru" src="voice-suguru.mp3" preload="auto"></audio>
                <audio id="voice-satoru" src="voice-satoru.mp3" preload="auto"></audio>

                <div class="player-info">
                    <span class="track-title" id="track-name">Gojo Satoru - The Honored One</span>
                    <span class="time-display" id="time-track">0:00 / 0:00</span>
                </div>
                
                <div class="progress-container" id="progress-cont">
                    <div class="progress-bar" id="progress-actual"></div>
                </div>
                
                <div class="player-controls">
                    <button class="play-btn" id="play-trigger">Play</button>
                </div>
            </div>
        </footer>

    </div>

    <script>
        const mainCanvas = document.getElementById('main-canvas');
        const charLayer = document.getElementById('character-layer');
        const charRender = document.getElementById('gojo-render');
        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-trigger');
        const playerCard = document.getElementById('player-card');
        const progressContainer = document.getElementById('progress-cont');
        const progressBar = document.getElementById('progress-actual');
        const timeDisplay = document.getElementById('time-track');

        const cinematicOverlay = document.getElementById('cinematic-layer');
        const cineEn = document.getElementById('cine-en');
        const cineJp = document.getElementById('cine-jp');
        const cineSub = document.getElementById('cine-sub');
        const voiceSuguru = document.getElementById('voice-suguru');
        const voiceSatoru = document.getElementById('voice-satoru');
        const koiFish = document.getElementById('koi-fish');

        let currentScene = 0;

        audio.addEventListener('ended', () => {
            if (currentScene === 0) activarModoGeto();
            else activarModoGojo();
        });

        function activarModoGeto() {
            audio.pause();
            charLayer.classList.add('shatter-effect');
            cinematicOverlay.classList.add('phase-shatter');
            koiFish.className = 'koi-wrapper mode-suguru active';

            cineEn.textContent = '"Suguru..."';
            cineJp.textContent = '「傑…」';
            voiceSuguru.currentTime = 0;
            voiceSuguru.play().catch(e => console.log(e));

            setTimeout(() => {
                currentScene = 1;
                document.body.classList.add('theme-geto');
                audio.src = "prison_realm.mp3";
                audio.currentTime = 0;
                document.getElementById('track-name').textContent = "Suguru Geto - Prison Realm";
                charRender.src = "geto.png";
                document.getElementById('quote-main').textContent = "We are the true humans.";
                document.getElementById('quote-sub').textContent = "特級呪詛師 // 獄門疆";
                document.getElementById('label-sub').textContent = "呪霊操術・うずまき";
                document.getElementById('label-kanji').textContent = "夏油";
                document.getElementById('badge-rank').textContent = "SPECIAL GRADE";
                audio.load();
            }, 1800);

            setTimeout(() => {
                charLayer.classList.remove('shatter-effect');
                cinematicOverlay.classList.remove('phase-shatter');
                koiFish.classList.remove('active');
                audio.play().then(() => playBtn.textContent = 'Pause').catch(err => playBtn.textContent = 'Play');
            }, 4200);
        }

        function activarModoGojo() {
            audio.pause();
            charLayer.classList.add('shatter-effect');
            cinematicOverlay.classList.add('phase-shatter');
            koiFish.className = 'koi-wrapper mode-satoru active';

            cineEn.textContent = '"Satoru..."';
            cineJp.textContent = '「よっ、悟」';
            voiceSatoru.currentTime = 0;
            voiceSatoru.play().catch(e => console.log(e));

            setTimeout(() => {
                currentScene = 0;
                document.body.classList.remove('theme-geto');
                audio.src = "gojo-ost.mp3";
                audio.currentTime = 0;
                document.getElementById('track-name').textContent = "Gojo Satoru - The Honored One";
                charRender.src = "gojo.png";
                document.getElementById('quote-main').textContent = "Throughout Heaven and Earth, I alone am the honored one.";
                document.getElementById('quote-sub').textContent = "天上天下唯我独尊 // 無量空処";
                document.getElementById('label-sub').textContent = "六眼・無下限呪術";
                document.getElementById('label-kanji').textContent = "五条";
                document.getElementById('badge-rank').textContent = "SPECIAL GRADE";
                audio.load();
            }, 1800);

            setTimeout(() => {
                charLayer.classList.remove('shatter-effect');
                cinematicOverlay.classList.remove('phase-shatter');
                koiFish.classList.remove('active');
                audio.play().then(() => playBtn.textContent = 'Pause').catch(err => playBtn.textContent = 'Play');
            }, 4200);
        }

        // Canvas de Partículas
        const petalCanvas = document.getElementById('petals-canvas');
        const ctx = petalCanvas.getContext('2d');

        function resizeCanvas() {
            petalCanvas.width = mainCanvas.clientWidth;
            petalCanvas.height = mainCanvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        const energyOrbs = [];
        for (let i = 0; i < 20; i++) {
            energyOrbs.push({
                x: Math.random() * 400, y: Math.random() * 800,
                size: Math.random() * 3 + 1,
                speedY: -(Math.random() * 0.6 + 0.2),
                alpha: Math.random() * 0.4 + 0.1
            });
        }

        function animateEnergy() {
            ctx.clearRect(0, 0, petalCanvas.width, petalCanvas.height);
            energyOrbs.forEach(orb => {
                orb.y += orb.speedY;
                if (orb.y < 0) orb.y = petalCanvas.height;
                ctx.fillStyle = (currentScene === 0) ? `rgba(56, 189, 248, ${orb.alpha})` : `rgba(239, 68, 68, ${orb.alpha})`;
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateEnergy);
        }
        animateEnergy();

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => playBtn.textContent = 'Pause').catch(err => console.error(err));
            } else {
                audio.pause();
                playBtn.textContent = 'Play';
            }
        });

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${percent}%`;
            const mins = Math.floor(audio.currentTime / 60);
            const secs = Math.floor(audio.currentTime % 60);
            timeDisplay.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs} / ${Math.floor(audio.duration/60)}:${Math.floor(audio.duration%60) < 10 ? '0':''}${Math.floor(audio.duration%60)}`;
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
        });
    </script>
</body>
</html>
